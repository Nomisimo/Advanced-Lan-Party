<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  /* Der Glow muss in den Rand des 64-px-Fensters passen (8 px), sonst wird er hart abgeschnitten */
  #knopf { position: absolute; inset: 8px; border-radius: 13px; background: radial-gradient(circle at 50% 38%, #2a2238, #16131d); border: 2px solid #9d5cff;
    box-shadow: 0 0 5px rgba(157, 92, 255, .55); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #knopf:hover { box-shadow: 0 0 7px rgba(157, 92, 255, .9); }
  #knopf svg { width: 70%; filter: drop-shadow(0 0 4px rgba(157, 92, 255, .8)); }
  /* Statuspunkt ohne eigenen Glow, mit dunklem Ring vom Glow des Icons abgesetzt */
  #punkt { position: absolute; right: 3px; top: 3px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #16131d; background: #7f7a8e; }
  #punkt.ok { background: #2ecc71; }
  #punkt.warn { background: #f39c12; }
  #punkt.err { background: #ff5d5d; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
</style></head>
<body>
  <div id="knopf" title="Advanced LAN">
    <svg viewBox="36 160 440 262"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98bff"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
      <path fill="url(#g)" d="M150 168h212c44 0 74 26 86 70l26 98c11 42-14 78-52 78-24 0-40-14-54-34l-22-32c-8-11-18-16-32-16h-116c-14 0-24 5-32 16l-22 32c-14 20-30 34-54 34-38 0-63-36-52-78l26-98c12-44 42-70 86-70z"/>
      <g fill="#16131d"><rect x="148" y="236" width="68" height="22" rx="6"/><rect x="171" y="213" width="22" height="68" rx="6"/><circle cx="350" cy="226" r="15"/><circle cx="384" cy="258" r="15"/><circle cx="316" cy="258" r="15"/><circle cx="350" cy="290" r="15"/></g>
    </svg>
  </div>
  <div id="punkt"></div>
<script>
  // Ziehen verschiebt das Overlay, ein Klick ohne Bewegung öffnet die App
  const knopf = document.getElementById("knopf"), punkt = document.getElementById("punkt");
  let start = null, bewegt = false;
  knopf.addEventListener("mousedown", (e) => { start = { x: e.screenX, y: e.screenY }; bewegt = false; });
  window.addEventListener("mousemove", (e) => {
    if (!start) return;
    const dx = e.screenX - start.x, dy = e.screenY - start.y;
    if (!bewegt && Math.abs(dx) + Math.abs(dy) < 4) return;
    bewegt = true; start = { x: e.screenX, y: e.screenY };
    window.overlayAPI.ziehen(dx, dy);
  });
  window.addEventListener("mouseup", () => {
    if (!start) return;
    start = null;
    bewegt ? window.overlayAPI.abgelegt() : window.overlayAPI.oeffnen();
  });
  window.overlayAPI.onStatus((s) => { punkt.className = s.farbe; knopf.title = "Advanced LAN: " + s.text; });
</script>
</body></html>
